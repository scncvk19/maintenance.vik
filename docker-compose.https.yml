services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:-maintenance.local}
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
