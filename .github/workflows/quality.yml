name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (isolated SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Run tests against temporary SQLite database
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

  postgres-restore:
    name: PostgreSQL backup restore (disposable CI database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maintenance_ci_test
          POSTGRES_USER: maintenance_ci_test
          POSTGRES_PASSWORD: test-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance_ci_test -d maintenance_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Export, preview, restore and validate encrypted data
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://maintenance_ci_test:test-only-postgres-password@127.0.0.1:5432/maintenance_ci_test
          TEST_ALLOW_DESTRUCTIVE_POSTGRES: ISOLATED_CI_ONLY
        run: python integration_postgres.py

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  backup-script:
    name: PowerShell backup syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse backup script without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Backup.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List | Out-String | Write-Error; exit 1 }

# The Playwright test which restores a backup is intentionally NOT run here:
# it replaces all application records and requires a dedicated disposable deployment.
