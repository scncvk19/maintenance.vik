name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (isolated SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Run tests against temporary SQLite database
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

  postgres-restore:
    name: PostgreSQL backup restore (disposable CI database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maintenance_ci_test
          POSTGRES_USER: maintenance_ci_test
          POSTGRES_PASSWORD: test-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance_ci_test -d maintenance_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Export, preview, restore and validate encrypted data
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://maintenance_ci_test:test-only-postgres-password@127.0.0.1:5432/maintenance_ci_test
          TEST_ALLOW_DESTRUCTIVE_POSTGRES: ISOLATED_CI_ONLY
        run: python integration_postgres.py

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify opt-in access gate in production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 APP_AUTH_PASSWORD=ci-test-password node .next/standalone/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/access-gate.mjs
      - name: Verify multi-user login and roles in production server
        run: |
          USERS=$(node -e "const {pbkdf2Sync}=require('node:crypto'); const users=[['admin','admin','ci-admin-password-123','00112233445566778899aabbccddeeff'],['viewer','viewer','ci-viewer-password-123','ffeeddccbbaa99887766554433221100']].map(([username,role,password,salt])=>({username,role,salt,hash:pbkdf2Sync(password,Buffer.from(salt,'hex'),310000,32,'sha256').toString('hex')})); process.stdout.write(Buffer.from(JSON.stringify(users)).toString('base64'))")
          HOSTNAME=127.0.0.1 PORT=3000 APP_AUTH_USERS_B64="$USERS" APP_SESSION_SECRET=ci-session-secret-at-least-32-characters-long node .next/standalone/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/multiuser-auth.mjs

  backup-script:
    name: PowerShell backup syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse backup script without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Backup.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Parse user setup script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Set-AppUser.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Exercise local user setup against temporary env
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'auth-setup'
          New-Item -ItemType Directory -Path $temp | Out-Null
          [IO.File]::WriteAllText((Join-Path $temp '.env'), ('POSTGRES_PASSWORD=test' + [Environment]::NewLine + 'APP_PORT=3000' + [Environment]::NewLine))
          $password = ConvertTo-SecureString 'ci-admin-password-123' -AsPlainText -Force
          ./scripts/Set-AppUser.ps1 -UserName admin -Role admin -Password $password -ProjectDirectory $temp
          $content = Get-Content -LiteralPath (Join-Path $temp '.env') -Raw
          if ($content -notmatch '(?m)^APP_AUTH_USERS_B64=.+$') { throw 'Benutzerkonfiguration wurde nicht geschrieben.' }
          if ($content -notmatch '(?m)^APP_SESSION_SECRET=[0-9a-f]{64}$') { throw 'Session-Secret wurde nicht geschrieben.' }

# The Playwright test which restores a backup is intentionally NOT run here:
# it replaces all application records and requires a dedicated disposable deployment.
