name: Apply tax vault fix once
on:
  push:
    branches: [fix/tax-vault-key-and-session]
    paths:
      - .github/workflows/apply-tax-vault-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply verified exact replacements
        run: python scripts/apply-tax-vault-fix.py
      - name: Commit source correction to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git diff --cached --check
          git commit -m 'fix: preserve password wrapper and expire sessions on restore'
          git push origin HEAD:fix/tax-vault-key-and-session
